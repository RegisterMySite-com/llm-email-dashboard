name = "llm-email-dashboard"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]

# Static assets (frontend)
# Worker runs first so unauthenticated visitors are sent to /login.html
[assets]
binding = "ASSETS"
directory = "./public"
run_worker_first = true
html_handling = "none"

# Account / session / audit store — database_id is filled during provision
[[d1_databases]]
binding = "DB"
database_name = "email-studio"
database_id = "REPLACE_AT_PROVISION"

[ai]
binding = "AI"

# Docs: https://developers.cloudflare.com/email-service/configuration/send-bindings/
[[send_email]]
name = "EMAIL"

[observability]
enabled = true

# Overwritten per tenant when registermysite.com provisions this Worker
[vars]
ROOT_DOMAIN = "example.com"
DEFAULT_FROM = "hello@example.com"
ALLOWED_SENDERS = "hello@example.com"
ADMIN_EMAILS = ""
PLATFORM = "registermysite.com"
TEMPLATE_REPO = "RegisterMySite-com/llm-email-dashboard"
